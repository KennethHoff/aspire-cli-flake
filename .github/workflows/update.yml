name: Update Aspire CLI versions

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    outputs:
      old_stable: ${{ steps.current.outputs.old_stable }}
      old_staging: ${{ steps.current.outputs.old_staging }}
      old_dev: ${{ steps.current.outputs.old_dev }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: cachix/install-nix-action@v30

      - name: Get current versions
        id: current
        run: |
          echo "old_stable=$(sed -n '/^  stable = {/,/^  };/{s/.*version = "\([^"]*\)".*/\1/p;}' versions.nix)" >> "$GITHUB_OUTPUT"
          echo "old_staging=$(sed -n '/^  staging = {/,/^  };/{s/.*version = "\([^"]*\)".*/\1/p;}' versions.nix)" >> "$GITHUB_OUTPUT"
          echo "old_dev=$(sed -n '/^  dev = {/,/^  };/{s/.*version = "\([^"]*\)".*/\1/p;}' versions.nix)" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "## Check Updates"
          echo ""
          echo "Current versions:"
          echo "- stable: ${{ steps.current.outputs.old_stable }}"
          echo "- staging: ${{ steps.current.outputs.old_staging }}"
          echo "- dev: ${{ steps.current.outputs.old_dev }}"

  update-channels:
    needs: check-updates
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
      stable: ${{ steps.new.outputs.stable }}
      staging: ${{ steps.new.outputs.staging }}
      dev: ${{ steps.new.outputs.dev }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: cachix/install-nix-action@v30

      - name: Update all channels
        run: ./update.sh

      - name: Get new versions
        id: new
        run: |
          echo "stable=$(sed -n '/^  stable = {/,/^  };/{s/.*version = "\([^"]*\)".*/\1/p;}' versions.nix)" >> "$GITHUB_OUTPUT"
          echo "staging=$(sed -n '/^  staging = {/,/^  };/{s/.*version = "\([^"]*\)".*/\1/p;}' versions.nix)" >> "$GITHUB_OUTPUT"
          echo "dev=$(sed -n '/^  dev = {/,/^  };/{s/.*version = "\([^"]*\)".*/\1/p;}' versions.nix)" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: check
        run: |
          has_changes=false
          if [[ "${{ needs.check-updates.outputs.old_stable }}" != "${{ steps.new.outputs.stable }}" ]]; then
            has_changes=true
          elif [[ "${{ needs.check-updates.outputs.old_staging }}" != "${{ steps.new.outputs.staging }}" ]]; then
            has_changes=true
          elif [[ "${{ needs.check-updates.outputs.old_dev }}" != "${{ steps.new.outputs.dev }}" ]]; then
            has_changes=true
          fi
          echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"

      - name: Restore versions if no changes
        if: steps.check.outputs.has_changes != 'true'
        run: git checkout versions.nix

      - name: Summary
        run: |
          echo "## Update Channels"
          echo ""
          if [[ "${{ steps.check.outputs.has_changes }}" == "true" ]]; then
            echo "Updates available:"
            echo "- stable: ${{ needs.check-updates.outputs.old_stable }} → ${{ steps.new.outputs.stable }}"
            echo "- staging: ${{ needs.check-updates.outputs.old_staging }} → ${{ steps.new.outputs.staging }}"
            echo "- dev: ${{ needs.check-updates.outputs.old_dev }} → ${{ steps.new.outputs.dev }}"
          else
            echo "No updates available. All channels already at latest version."
          fi

  generate-summary:
    needs: [check-updates, update-channels]
    if: needs.update-channels.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Generate job summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLD_STABLE: ${{ needs.check-updates.outputs.old_stable }}
          OLD_STAGING: ${{ needs.check-updates.outputs.old_staging }}
          OLD_DEV: ${{ needs.check-updates.outputs.old_dev }}
        run: |
          declare -A OLD_VERSIONS=(
            [stable]="$OLD_STABLE"
            [staging]="$OLD_STAGING"
            [dev]="$OLD_DEV"
          )

          {
            echo "## Aspire CLI Version Update Summary"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          for channel in stable staging dev; do
            old_version="${OLD_VERSIONS[$channel]}"
            new_version=$(sed -n "/^  $channel = {/,/^  };/{s/.*version = \"\([^\"]*\)\".*/\1/p;}" versions.nix)

            {
              echo "### Channel: \`$channel\`"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"

            if [[ "$old_version" == "$new_version" ]]; then
              echo "No update. Current version: \`$new_version\`" >> "$GITHUB_STEP_SUMMARY"
            else
              {
                echo "| | Version |"
                echo "| --- | --- |"
                echo "| **Old** | \`$old_version\` |"
                echo "| **New** | \`$new_version\` |"
                echo ""
              } >> "$GITHUB_STEP_SUMMARY"

              release_body=""
              release_url=""
              successful_new_tag=""
              for tag in "v${new_version}" "${new_version}"; do
                release_json=$(gh api "repos/dotnet/aspire/releases/tags/${tag}" 2>/dev/null || true)
                if [[ -n "$release_json" ]] && echo "$release_json" | jq -e '.tag_name' > /dev/null 2>&1; then
                  release_body=$(echo "$release_json" | jq -r '.body // ""')
                  release_url=$(echo "$release_json" | jq -r '.html_url // ""')
                  successful_new_tag="$tag"
                  break
                fi
              done

              if [[ -n "$release_body" || -n "$release_url" ]]; then
                {
                  echo "#### Release Notes"
                  echo ""
                  if [[ -n "$release_url" ]]; then
                    echo "[View on GitHub]($release_url)"
                    echo ""
                  fi
                  if [[ -n "$release_body" ]]; then
                    echo "$release_body"
                    echo ""
                  fi
                } >> "$GITHUB_STEP_SUMMARY"
              fi

              new_tag="${successful_new_tag:-v${new_version}}"
              commits_md=""
              compare_url=""
              for old_tag in "v${old_version}" "${old_version}"; do
                compare_json=$(gh api "repos/dotnet/aspire/compare/${old_tag}...${new_tag}" 2>/dev/null || true)
                if [[ -n "$compare_json" ]] && echo "$compare_json" | jq -e '.commits' > /dev/null 2>&1; then
                  compare_url=$(echo "$compare_json" | jq -r '.permalink_url // .html_url // ""')
                  commits_md=$(echo "$compare_json" | jq -r \
                    '.commits[] | "- [`\(.sha[0:7])`](\(.html_url)) \(.commit.message | split("\n")[0])"' \
                    2>/dev/null || true)
                  break
                fi
              done

              if [[ -n "$commits_md" || -n "$compare_url" ]]; then
                {
                  echo "#### Commit Diff"
                  echo ""
                  if [[ -n "$compare_url" ]]; then
                    echo "[View full diff on GitHub]($compare_url)"
                    echo ""
                  fi
                  if [[ -n "$commits_md" ]]; then
                    echo "$commits_md"
                    echo ""
                  fi
                } >> "$GITHUB_STEP_SUMMARY"
              fi
            fi

            echo "" >> "$GITHUB_STEP_SUMMARY"
          done

  create-pr:
    needs: [check-updates, update-channels]
    if: needs.update-channels.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr_number: ${{ steps.cpr.outputs.pull-request-number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Create PR
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update Aspire CLI versions"
          title: "chore: update Aspire CLI versions"
          body: >
            Automated weekly update of Aspire CLI versions across all channels.
          branch: auto-update-aspire-cli
          delete-branch: true

      - name: Summary
        run: |
          echo "## Create PR"
          echo ""
          echo "Pull request #${{ steps.cpr.outputs.pull-request-number }} created successfully."

  enable-auto-merge:
    needs: create-pr
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_NUMBER"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.create-pr.outputs.pr_number }}

      - name: Summary
        run: |
          echo "## Enable Auto-Merge"
          echo ""
          echo "Auto-merge enabled on PR #$PR_NUMBER."
