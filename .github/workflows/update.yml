name: Update Aspire CLI versions

on:
  schedule:
    - cron: "0 6 * * 2" # Every Tuesday at 06:00 UTC
  workflow_dispatch:

# Least-privilege default; jobs that write opt in explicitly below.
permissions:
  contents: read

# Stop a manual run from racing the scheduled one onto the same PR branch.
concurrency:
  group: update-aspire-cli
  cancel-in-progress: false

jobs:
  detect:
    name: Detect current versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      old_stable: ${{ steps.get-versions.outputs.old_stable }}
      old_staging: ${{ steps.get-versions.outputs.old_staging }}
      old_dev: ${{ steps.get-versions.outputs.old_dev }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: master

      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30

      - name: Get current versions
        id: get-versions
        run: |
          echo "old_stable=$(sed -n '/^  stable = {/,/^  };/{s/.*version = "\([^"]*\)".*/\1/p;}' versions.nix)" >> "$GITHUB_OUTPUT"
          echo "old_staging=$(sed -n '/^  staging = {/,/^  };/{s/.*version = "\([^"]*\)".*/\1/p;}' versions.nix)" >> "$GITHUB_OUTPUT"
          echo "old_dev=$(sed -n '/^  dev = {/,/^  };/{s/.*version = "\([^"]*\)".*/\1/p;}' versions.nix)" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "| Channel | Version |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| stable | \`${{ steps.get-versions.outputs.old_stable }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| staging | \`${{ steps.get-versions.outputs.old_staging }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| dev | \`${{ steps.get-versions.outputs.old_dev }}\` |" >> $GITHUB_STEP_SUMMARY

  update:
    name: Fetch latest versions
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      has_changes: ${{ steps.check-changes.outputs.has_changes }}
      stable: ${{ steps.get-versions.outputs.stable }}
      staging: ${{ steps.get-versions.outputs.staging }}
      dev: ${{ steps.get-versions.outputs.dev }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: master

      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30

      - name: Update all channels
        run: ./update.sh

      - name: Get new versions
        id: get-versions
        run: |
          echo "stable=$(sed -n '/^  stable = {/,/^  };/{s/.*version = "\([^"]*\)".*/\1/p;}' versions.nix)" >> "$GITHUB_OUTPUT"
          echo "staging=$(sed -n '/^  staging = {/,/^  };/{s/.*version = "\([^"]*\)".*/\1/p;}' versions.nix)" >> "$GITHUB_OUTPUT"
          echo "dev=$(sed -n '/^  dev = {/,/^  };/{s/.*version = "\([^"]*\)".*/\1/p;}' versions.nix)" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: check-changes
        run: |
          has_changes=false
          if [[ "${{ needs.detect.outputs.old_stable }}" != "${{ steps.get-versions.outputs.stable }}" ]]; then
            has_changes=true
          elif [[ "${{ needs.detect.outputs.old_staging }}" != "${{ steps.get-versions.outputs.staging }}" ]]; then
            has_changes=true
          elif [[ "${{ needs.detect.outputs.old_dev }}" != "${{ steps.get-versions.outputs.dev }}" ]]; then
            has_changes=true
          fi
          echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"

      - name: Upload updated versions
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: updated-versions
          path: versions.nix

      - name: Restore versions if no changes
        if: steps.check-changes.outputs.has_changes != 'true'
        run: git checkout versions.nix

      - name: Summary
        run: |
          if [[ "${{ steps.check-changes.outputs.has_changes }}" == "true" ]]; then
            echo "| Channel | Old | New |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|-----|-----|" >> $GITHUB_STEP_SUMMARY
            echo "| stable | \`${{ needs.detect.outputs.old_stable }}\` | \`${{ steps.get-versions.outputs.stable }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| staging | \`${{ needs.detect.outputs.old_staging }}\` | \`${{ steps.get-versions.outputs.staging }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| dev | \`${{ needs.detect.outputs.old_dev }}\` | \`${{ steps.get-versions.outputs.dev }}\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No updates available. All channels already at latest version." >> $GITHUB_STEP_SUMMARY
          fi

  # Gate the PR on a real build of every supported system. versions.nix carries
  # a per-system hash (hashes.${system}); a single Linux runner can only build
  # the Linux outputs, so a bad darwin/aarch64 hash would otherwise sail through
  # to an auto-merged PR. One runner per system, each building natively. If any
  # leg fails, create-pull-request (needs: verify) is skipped and no PR opens.
  # `nix flake check` builds all three channel packages (the channelPackages
  # test) plus the regression tests, so no separate `nix build` is needed.
  verify:
    name: Verify build (${{ matrix.system }})
    needs: update
    if: needs.update.outputs.has_changes == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: master

      # Overwrite the committed versions.nix with the freshly bumped one. nix
      # reads the dirty working tree for tracked files, so the build verifies
      # the new versions rather than HEAD.
      - name: Download updated versions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: updated-versions

      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30

      - name: Build and test all channels
        run: nix flake check -L

  create-pull-request:
    name: Create pull request
    needs: [detect, update, verify]
    if: needs.update.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr_number: ${{ steps.create-pull-request.outputs.pull-request-number }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: master

      - name: Download updated versions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: updated-versions

      - name: Create PR
        id: create-pull-request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          commit-message: "chore: update Aspire CLI versions"
          title: "chore: update Aspire CLI versions"
          body: >
            Automated weekly update of Aspire CLI versions across all channels.
          branch: auto-update-aspire-cli
          delete-branch: true

      - name: Summary
        run: |
          echo "✅ PR #[${{ steps.create-pull-request.outputs.pull-request-number }}](https://github.com/KennethHoff/aspire-cli-flake/pull/${{ steps.create-pull-request.outputs.pull-request-number }}) created successfully." >> $GITHUB_STEP_SUMMARY

  enable-auto-merge:
    name: Enable auto-merge
    needs: create-pull-request
    if: needs.create-pull-request.outputs.pr_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # contents:write is required: with no required status checks gating the
      # PR, `gh pr merge --auto` performs an immediate mergePullRequest, which
      # writes the merge commit to master.
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: master

      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_NUMBER"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.create-pull-request.outputs.pr_number }}

      - name: Summary
        run: |
          echo "✅ Auto-merge enabled on PR #${{ needs.create-pull-request.outputs.pr_number }}." >> $GITHUB_STEP_SUMMARY
